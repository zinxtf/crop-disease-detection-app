name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Build Crop Doctor APK
        run: |
          pip install Pillow
          flutter create --platforms=android . --project-name crop_disease_detection_app --overwrite
          sed -i 's/android:label=".*"/android:label="Crop Doctor"/' android/app/src/main/AndroidManifest.xml
          flutter pub get
          python3 -c "
          from PIL import Image
          import os, glob, pathlib
          icon_path = None
          for pat in ['assets/icon.png','assets/*.jpg','assets/*.JPG','assets/*.jpeg','assets/*.png']:
            files = glob.glob(pat)
            if files:
              icon_path = files[0]
              break
          print(f'Icon: {icon_path}')
          if icon_path and os.path.exists(icon_path):
            try:
              im = Image.open(icon_path).convert('RGBA')
              w,h = im.size
              m = min(w,h)
              im = im.crop(((w-m)//2, (h-m)//2, (w-m)//2+m, (h-m)//2+m))
              for dpi,size in [('mipmap-mdpi',48),('mipmap-hdpi',72),('mipmap-xhdpi',96),('mipmap-xxhdpi',144),('mipmap-xxxhdpi',192)]:
                pathlib.Path(f'android/app/src/main/res/{dpi}').mkdir(parents=True, exist_ok=True)
                im.resize((size,size), Image.LANCZOS).save(f'android/app/src/main/res/{dpi}/ic_launcher.png','PNG')
            except Exception as e:
              print(e)
          "
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Crop-Doctor-Full-App
          path: build/app/outputs/flutter-apk/app-release.apk
