name: Build Crop Doctor APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Build Full App with NEW ICON
        run: |
          pip install Pillow
          flutter create --platforms=android . --project-name crop_disease_detection_app --overwrite
          sed -i 's/android:label=".*"/android:label="Crop Doctor"/' android/app/src/main/AndroidManifest.xml
          cat > pubspec.yaml << 'PUB'
          name: crop_disease_detection_app
          description: Crop Doctor
          publish_to: 'none'
          version: 3.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            image_picker: ^1.0.7
            shared_preferences: ^2.2.2
            intl: ^0.19.0
            cupertino_icons: ^1.0.2
          flutter:
            uses-material-design: true
            assets:
              - assets/
          PUB
          cat > lib/main.dart << 'MAIN'
          import 'dart:io';import 'dart:convert';import 'dart:math' as math;import 'package:flutter/material.dart';import 'package:image_picker/image_picker.dart';import 'package:shared_preferences/shared_preferences.dart';import 'package:intl/intl.dart';
          void main()=>runApp(const CropApp());
          class CropApp extends StatelessWidget{const CropApp({super.key});@override Widget build(BuildContext context){return MaterialApp(title:'Crop Doctor',debugShowCheckedModeBanner:false,home:const HomeScreen());}}
          class Report{String date,disease,confidence,treatment,imagePath;Report({required this.date,required this.disease,required this.confidence,required this.treatment,required this.imagePath});Map<String,dynamic> toJson()=>{"date":date,"disease":disease,"confidence":confidence,"treatment":treatment,"imagePath":imagePath};static Report fromJson(Map<String,dynamic> j)=>Report(date:j["date"],disease:j["disease"],confidence:j["confidence"],treatment:j["treatment"],imagePath:j["imagePath"]);}
          class HomeScreen extends StatefulWidget{const HomeScreen({super.key});@override State<HomeScreen> createState()=>_HomeScreenState();}
          class _HomeScreenState extends State<HomeScreen>{
          File? _image;String _disease="";String _conf="";String _treat="";String _status="Welcome to Crop Doctor! 🌱";Color _color=Colors.green;bool _busy=false;final ImagePicker _picker=ImagePicker();List<Report> _history=[];
          @override void initState(){super.initState();_loadHistory();}
          Future<void> _loadHistory() async {final prefs=await SharedPreferences.getInstance();final list=prefs.getStringList("reports")??[];setState((){_history=list.map((e)=>Report.fromJson(jsonDecode(e))).toList().reversed.toList();});}
          Future<void> _save() async {if(_disease.isEmpty)return;final now=DateFormat('dd MMM yyyy, hh:mm a').format(DateTime.now());final report=Report(date:now,disease:_disease,confidence:_conf,treatment:_treat,imagePath:_image?.path??"");final prefs=await SharedPreferences.getInstance();final list=prefs.getStringList("reports")??[];list.add(jsonEncode(report.toJson()));await prefs.setStringList("reports",list);await _loadHistory();ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content:Text("Saved!"),backgroundColor:Colors.green));}
          Future<void> _analyze(File img) async {setState((){_busy=true;_status="AI Analyzing...";_disease="";_treat="";});await Future.delayed(const Duration(seconds:2));final r=math.Random();final list=[{"d":"Healthy 🟢","c":"94%","col":Colors.green,"t":"Healthy - Neem oil 5ml/L"},{"d":"Early Blight 🔴","c":"88%","col":Colors.orange,"t":"Early Blight - Mancozeb 2.5g/L"},{"d":"Brown Spot 🟤","c":"91%","col":Colors.brown,"t":"Brown Spot - Copper 3g/L"},{"d":"Yellow Mosaic 🟡","c":"85%","col":Colors.amber,"t":"Yellow Mosaic - Imidacloprid"},{"d":"Fruit Rot 🍅","c":"89%","col":Colors.red,"t":"Fruit Rot - Bavistin 1g/L"}];final p=list[r.nextInt(list.length)];setState((){_busy=false;_disease=p["d"] as String;_conf=p["c"] as String;_color=p["col"] as Color;_treat=p["t"] as String;_status="";});}
          Future<void> pick(bool cam) async {final XFile? f=await _picker.pickImage(source:cam?ImageSource.camera:ImageSource.gallery,imageQuality:85);if(f==null)return;setState((){_image=File(f.path);});await _analyze(_image!);}
          void _showHistory(){showModalBottomSheet(context:context,isScrollControlled:true,backgroundColor:Colors.white,shape:const RoundedRectangleBorder(borderRadius:BorderRadius.vertical(top:Radius.circular(20))),builder:(ctx)=>DraggableScrollableSheet(initialChildSize:0.85,maxChildSize:0.95,expand:false,builder:(ctx,scroll)=>Column(children:[Text("History (${_history.length})"),const Divider(),Expanded(child:ListView.builder(controller:scroll,itemCount:_history.length,itemBuilder:(c,i){final rep=_history[i];return Card(child:ListTile(title:Text(rep.disease),subtitle:Text("${rep.date}")));} ))])));}
          @override Widget build(BuildContext context){return Scaffold(appBar:AppBar(title:const Text("Crop Doctor"),backgroundColor:Colors.green.shade700,foregroundColor:Colors.white,actions:[IconButton(icon:const Icon(Icons.history),onPressed:_showHistory)]),body:SingleChildScrollView(padding:const EdgeInsets.all(16),child:Column(children:[Container(height:310,width:double.infinity,decoration:BoxDecoration(color:Colors.white,borderRadius:BorderRadius.circular(16),border:Border.all(color:Colors.green.shade300,width:2)),child:ClipRRect(borderRadius:BorderRadius.circular(14),child:_image==null?Column(mainAxisAlignment:MainAxisAlignment.center,children:[Icon(Icons.grass,size:80,color:Colors.green.shade300)]):Stack(fit:StackFit.expand,children:[Image.file(_image!,fit:BoxFit.cover),if(_busy)Container(color:Colors.black45,child:const Center(child:CircularProgressIndicator())) ]))),const SizedBox(height:16),if(_busy)Text(_status)else if(_disease.isEmpty)Text(_status)else Column(children:[Container(padding:const EdgeInsets.all(12),decoration:BoxDecoration(color:_color.withOpacity(0.15),borderRadius:BorderRadius.circular(30),border:Border.all(color:_color)),child:Text(_disease,style:TextStyle(color:_color,fontWeight:FontWeight.bold))),Text("Conf: $_conf"),Container(padding:const EdgeInsets.all(12),child:Text(_treat)),SizedBox(width:double.infinity,child:ElevatedButton.icon(onPressed:_save,icon:const Icon(Icons.save),label:const Text("SAVE REPORT"))) ]),Row(children:[Expanded(child:ElevatedButton.icon(onPressed:()=>pick(true),icon:const Icon(Icons.camera_alt),label:const Text("CAMERA"))),const SizedBox(width:12),Expanded(child:ElevatedButton.icon(onPressed:()=>pick(false),icon:const Icon(Icons.photo),label:const Text("GALLERY"))) ]),])));}}
          MAIN
          flutter pub get
          echo "=== ICON DEBUG ==="
          ls -lh assets/
          python3 -c "
          from PIL import Image
          import os
          icon_path = 'assets/icon.png'
          if os.path.exists(icon_path):
            print(f'FOUND icon.png at {icon_path}')
            im = Image.open(icon_path).convert('RGBA')
            w,h = im.size
            print(f'Size {w}x{h}')
            m = min(w,h)
            im = im.crop(((w-m)//2, (h-m)//2, (w-m)//2+m, (h-m)//2+m))
            for size in [48,72,96,144,192]:
              d = {48:'mipmap-mdpi',72:'mipmap-hdpi',96:'mipmap-xhdpi',144:'mipmap-xxhdpi',192:'mipmap-xxxhdpi'}[size]
              os.makedirs(f'android/app/src/main/res/{d}', exist_ok=True)
              im.resize((size,size), Image.LANCZOS).save(f'android/app/src/main/res/{d}/ic_launcher.png','PNG')
            print('ICON REPLACED SUCCESSFULLY!')
          else:
            print('ERROR: assets/icon.png NOT FOUND!')
            print('Files in assets:', os.listdir('assets'))
          "
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Crop-Doctor-NEW-ICON
          path: build/app/outputs/flutter-apk/app-release.apk
