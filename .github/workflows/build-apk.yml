name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      - name: Fix Project and Convert Your Icon to Real PNG
        run: |
          flutter create --platforms=android . --project-name crop_disease_detection_app --overwrite
          flutter pub get
          python3 -c "
          from PIL import Image
          import os, glob
          # Find your icon (any jpg/png in assets)
          icon_path = None
          for p in ['assets/icon.png', 'assets/IMG-20261104-WA2902.jpg', 'assets/IMG-20261104-WA2902.png']:
            if os.path.exists(p):
              icon_path = p
              break
          if not icon_path:
            # find any jpg in assets
            files = glob.glob('assets/*.jpg') + glob.glob('assets/*.jpeg') + glob.glob('assets/*.png')
            if files:
              icon_path = files[0]
          print(f'Using icon: {icon_path}')
          if icon_path:
            im = Image.open(icon_path).convert('RGBA')
            w,h = im.size
            m = min(w,h)
            im = im.crop(((w-m)//2, (h-m)//2, (w-m)//2+m, (h-m)//2+m))
            # Create 5 sizes for Android
            for dpi, size in [('mipmap-mdpi',48),('mipmap-hdpi',72),('mipmap-xhdpi',96),('mipmap-xxhdpi',144),('mipmap-xxxhdpi',192)]:
              import pathlib
              pathlib.Path(f'android/app/src/main/res/{dpi}').mkdir(parents=True, exist_ok=True)
              resized = im.resize((size,size), Image.LANCZOS)
              resized.save(f'android/app/src/main/res/{dpi}/ic_launcher.png', 'PNG')
            print('Icons created!')
          "
      - name: Build APK
        run: flutter build apk --release --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: crop-disease-apk
          path: build/app/outputs/flutter-apk/app-release.apk
