name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      - name: Fix Project and Set Your Icon
        run: |
          flutter create --platforms=android . --project-name crop_disease_detection_app --overwrite
          flutter pub get
          echo "Setting your custom icon..."
          for dpi in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p android/app/src/main/res/$dpi
            cp assets/icon.png android/app/src/main/res/$dpi/ic_launcher.png
          done
          ls android/app/src/main/res/mipmap-hdpi/
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: crop-disease-apk
          path: build/app/outputs/flutter-apk/app-release.apk
