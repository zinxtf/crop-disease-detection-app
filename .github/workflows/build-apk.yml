name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      - name: Fix Project and Convert Your Icon
        run: |
          pip install Pillow
          flutter create --platforms=android . --project-name crop_disease_detection_app --overwrite
          flutter pub get
          python3 -c "
          from PIL import Image
          import os, glob, pathlib
          icon_path = None
          for p in ['assets/icon.png', 'assets/IMG-20261104-WA2902.jpg', 'assets/IMG-20261104-WA2902.png']:
            if os.path.exists(p):
              icon_path = p
              break
          if not icon_path:
            files = glob.glob('assets/*.jpg') + glob.glob('assets/*.jpeg') + glob.glob('assets/*.png') + glob.glob('assets/*.JPG')
            if files:
              icon_path = files[0]
          print(f'Found icon: {icon_path}')
          if icon_path:
            im = Image.open(icon_path).convert('RGBA')
            w,h = im.size
            m = min(w,h)
            left = (w-m)//2
            top = (h-m)//2
            im = im.crop((left, top, left+m, top+m))
            for dpi, size in [('mipmap-mdpi',48),('mipmap-hdpi',72),('mipmap-xhdpi',96),('mipmap-xxhdpi',144),('mipmap-xxxhdpi',192)]:
              pathlib.Path(f'android/app/src/main/res/{dpi}').mkdir(parents=True, exist_ok=True)
              resized = im.resize((size,size), Image.LANCZOS)
              resized.save(f'android/app/src/main/res/{dpi}/ic_launcher.png', 'PNG')
            print('All 5 icons created SUCCESS!')
          else:
            print('No icon found, using default')
          "
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: crop-disease-apk
          path: build/app/outputs/flutter-apk/app-release.apk
