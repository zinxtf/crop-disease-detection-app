name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      - name: Restore Your Real Crop App + Icon
        run: |
          pip install Pillow
          # Save your icon first if exists
          mkdir -p /tmp/backup
          cp -r assets /tmp/backup/ 2>/dev/null || true
          
          flutter create --platforms=android . --project-name crop_disease_detection_app --overwrite
          flutter pub add image_picker
          
          # Restore assets
          rm -rf assets
          cp -r /tmp/backup/assets . 2>/dev/null || mkdir -p assets
          
          # Create REAL Crop Disease App main.dart
          cat > lib/main.dart << 'FLUTTER_CODE'
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:image_picker/image_picker.dart';

          void main() => runApp(CropApp());

          class CropApp extends StatelessWidget {
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Crop Disease Detection',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(primarySwatch: Colors.green, useMaterial3: true),
                home: HomeScreen(),
              );
            }
          }

          class HomeScreen extends StatefulWidget {
            @override
            _HomeScreenState createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            File? _image;
            final picker = ImagePicker();
            String result = "Take a photo of crop leaf to detect disease";

            Future getImage(bool isCamera) async {
              final pickedFile = await picker.pickImage(source: isCamera ? ImageSource.camera : ImageSource.gallery);
              if (pickedFile != null) {
                setState(() {
                  _image = File(pickedFile.path);
                  result = "Analyzing...\n\nThis is a demo. Connect AI model for real detection.\n\nDetected: Healthy Leaf (Sample)\nConfidence: 95%";
                });
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text("🌱 Crop Disease Detection"), backgroundColor: Colors.green, foregroundColor: Colors.white, centerTitle: true),
                body: SingleChildScrollView(
                  padding: EdgeInsets.all(20),
                  child: Column(
                    children: [
                      Container(
                        height: 300, width: double.infinity,
                        decoration: BoxDecoration(border: Border.all(color: Colors.green), borderRadius: BorderRadius.circular(15)),
                        child: _image == null 
                          ? Icon(Icons.grass, size: 100, color: Colors.green.shade300)
                          : ClipRRect(borderRadius: BorderRadius.circular(15), child: Image.file(_image!, fit: BoxFit.cover)),
                      ),
                      SizedBox(height: 20),
                      Text(result, textAlign: TextAlign.center, style: TextStyle(fontSize: 16, fontWeight: FontWeight.w500)),
                      SizedBox(height: 30),
                      Row(
                        mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                        children: [
                          ElevatedButton.icon(onPressed: () => getImage(true), icon: Icon(Icons.camera_alt), label: Text("Camera"), style: ElevatedButton.styleFrom(backgroundColor: Colors.green, foregroundColor: Colors.white, padding: EdgeInsets.symmetric(horizontal: 25, vertical: 15))),
                          ElevatedButton.icon(onPressed: () => getImage(false), icon: Icon(Icons.photo), label: Text("Gallery"), style: ElevatedButton.styleFrom(backgroundColor: Colors.green.shade700, foregroundColor: Colors.white, padding: EdgeInsets.symmetric(horizontal: 25, vertical: 15))),
                        ],
                      ),
                      SizedBox(height: 20),
                      Card(color: Colors.green.shade50, child: Padding(padding: EdgeInsets.all(15), child: Column(children: [Icon(Icons.lightbulb, color: Colors.green), SizedBox(height: 5), Text("Tips: Take clear photo in daylight. Focus on affected leaf area.", textAlign: TextAlign.center, style: TextStyle(color: Colors.green.shade900))]))),
                    ],
                  ),
                ),
              );
            }
          }
          FLUTTER_CODE
          
          flutter pub get
          
          # Now convert your JPG to real PNG icons
          python3 -c "
          from PIL import Image
          import os, glob, pathlib
          icon_path = None
          for p in ['assets/icon.png', 'assets/IMG-20261104-WA2902.jpg', 'assets/IMG-20261104-WA2902.png', 'assets/IMG-20261104-WA2902.JPG']:
            if os.path.exists(p):
              icon_path = p
              break
          if not icon_path:
            files = glob.glob('assets/*.*')
            for f in files:
              if f.lower().endswith(('.jpg','.jpeg','.png')):
                icon_path = f
                break
          print(f'Icon found: {icon_path}')
          if icon_path:
            im = Image.open(icon_path).convert('RGBA')
            w,h = im.size
            m = min(w,h)
            im = im.crop(((w-m)//2, (h-m)//2, (w-m)//2+m, (h-m)//2+m))
            for dpi, size in [('mipmap-mdpi',48),('mipmap-hdpi',72),('mipmap-xhdpi',96),('mipmap-xxhdpi',144),('mipmap-xxxhdpi',192)]:
              pathlib.Path(f'android/app/src/main/res/{dpi}').mkdir(parents=True, exist_ok=True)
              resized = im.resize((size,size), Image.LANCZOS)
              resized.save(f'android/app/src/main/res/{dpi}/ic_launcher.png', 'PNG')
            print('Icons done!')
          "
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: crop-disease-apk
          path: build/app/outputs/flutter-apk/app-release.apk
